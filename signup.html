<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    
    <!-- CSS Links -->
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <header>
        <!--Navigation Bar for other pages.-->
        <nav>
            <ul class="flex-container">
                <li><a href="./index.html">Home</a></li>
                <li><a href="./table.html">Gaming Table</a></li>
                <li><a href="./rules.html">Blackjack Rules</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!--Signup Section-->
        <section class="top-element">
            <h2>Sign Up</h2>
            <form id="signUpForm">
                <!--Fields-->
                <div>
                    <!--Real Name-->
                    <div class="spaced-element">
                        <label for="real-name-field">Full Name</label>
                        <div class="spaced-element-small">
                            <input type="text" id="real-name-field" class="input-field" placeholder="Enter Full Name">
                            <p id="real-name-error" hidden>Invalid Name!</p>
                        </div>
                    </div>

                    <!--Username-->
                    <div class="spaced-element">
                        <label for="user-name-field">Username</label>
                        <div class="spaced-element-small">
                            <input type="text" id="user-name-field" class="input-field" placeholder="Enter Username">
                            <p id="user-name-error" hidden>Invalid Name!</p>
                        </div>
                    </div>

                    <!--Passwords-->
                    <div class="spaced-element">
                        <label for="password-field">Password</label>
                        <!--Initial Password-->
                        <div class="spaced-element-small">
                            <input type="password" id="password-field" class="input-with-button" placeholder="Enter Password">
                            <button type="button" id="password-show">Show</button>
                            <p id="password-error" hidden>Invalid Password!</p>
                        </div>

                        <!--Recheck Password-->
                        <div class="spaced-element-small">
                            <input type="password" id="recheck-field" class="input-with-button" placeholder="Re-enter Password">
                            <button type="button" id="recheck-show">Show</button>
                            <p id="recheck-error" hidden>Passwords do not match!</p>
                        </div>
                    </div>

                    <!--Birthdate-->
                    <div class="spaced-element">
                        <label for="birthdate-field">Date of Birth</label>
                        <div class="spaced-element-small">
                            <input type="date" id="birthdate-field" class="input-field" placeholder="Enter DOB">
                            <p id="birthdate-error" hidden>Invalid Birthdate!</p>
                        </div>
                    </div>
                </div>

                <!--Terms and Conditions Checkboxes-->
                <div class="spaced-element">
                    <p><input type="checkbox" id="legal-checkbox">I have read and agreed to Leverage's Legal Policy.</p>
                    <p><input type="checkbox" id="terms-checkbox">I agree to the Leverage website's Terms and Conditions.</p>
                </div>

                <!--Submit-->
                <button type="submit" id="submitForm">Login</button>
            </form>
        </section>
    </main>

    <footer>
        <!--Leverage Copyright-->
        <p class="footer-copyright">&copy; Copyright 2025 <span id="footer">Leverage</span></p>
    </footer>

    <script src="signup.js"></script>
</body>
</html>
